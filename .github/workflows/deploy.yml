name: Deploy PampoBoard to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: GH_CLIENT_ID,GH_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            set -e
            echo "🚀 Iniciando Deploy do PampoBoard na VPS..."

            # 1. Verifica se o diretório do projeto existe; se não, clona o repositório
            if [ ! -d "/root/pampoboard" ]; then
              echo "📥 Clonando repositório inicial WesleyFreitass/PampoBoard..."
              git clone https://github.com/WesleyFreitass/PampoBoard.git /root/pampoboard
            fi

            # 2. Navega e atualiza o código para a versão mais recente da branch main
            cd /root/pampoboard
            echo "🔄 Atualizando código da branch main..."
            git clean -fd
            git fetch origin main
            git reset --hard origin/main

            # 3. Configura o arquivo .env com as credenciais oficiais dos GitHub Secrets
            echo "🔐 Escrevendo credenciais seguras no .env..."
            echo "GITHUB_CLIENT_ID=$GH_CLIENT_ID" > /root/pampoboard/.env
            echo "GITHUB_CLIENT_SECRET=$GH_CLIENT_SECRET" >> /root/pampoboard/.env
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> /root/pampoboard/.env
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> /root/pampoboard/.env

            # 4. Reconstrói e sobe os containers Docker com resiliência
            echo "🐳 Construindo e iniciando containers Docker na porta 3110..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            echo "✅ Deploy do PampoBoard concluído com sucesso!"
            docker ps --filter "name=pampo"
