services:
  mongodb:
    image: mongo:7-jammy
    container_name: pampoboard-mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=pampoboard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pampoboard:
    container_name: pampoboard
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3110:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/pampoboard
      - JWT_SECRET=pampoboard_super_secret_jwt_key_2026_x88
      - GITHUB_CLIENT_ID=Ov23liQEY3WOfw3xlkAY
      - GITHUB_CLIENT_SECRET=b5515be2b3037d2b8eb0f04113001739d28c1195
    depends_on:
      - mongodb
    volumes:
      - uploads-data:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:
  uploads-data:
